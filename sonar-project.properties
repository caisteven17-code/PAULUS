# SonarCloud project configuration
# https://sonarcloud.io/dashboard?id=caisteven17-code_CAPSTONE-PROTOTYPE

sonar.projectKey=caisteven17-code_CAPSTONE-PROTOTYPE
sonar.organization=caisteven17-code
sonar.projectName=Diocese of San Pablo — Financial Analytics System

# Source roots (frontend TS/TSX, backend TS, Python analytics)
sonar.sources=src/frontend/src,src/backend/src,src/analytics

# Test and generated file exclusions
sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/.next/**,\
  **/__pycache__/**,\
  **/*.spec.ts,\
  **/*.test.ts,\
  **/*.test.tsx,\
  **/coverage/**,\
  src/frontend/src/utils/mockData.js,\
  src/frontend/src/utils/seminaryMockData.ts

# Language-specific settings
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.python.version=3.12

# Encoding
sonar.sourceEncoding=UTF-8
