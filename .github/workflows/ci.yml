name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# =============================================================================
# STAGE 1 — VALIDATE
# Fast checks that catch the most common issues first.
# All jobs run in parallel. Stage 2 only starts when every job here passes.
# =============================================================================

jobs:

  # ── Frontend: ESLint + TypeScript + Prettier ──────────────────────────────
  validate-frontend:
    name: "[1] Frontend — Lint, Types, Format"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint --workspace=src/frontend

      - name: TypeScript check
        run: npm run typecheck --workspace=src/frontend

      - name: Prettier format check
        run: npm run format:check --workspace=src/frontend

  # ── Backend: TypeScript + Prettier ───────────────────────────────────────
  validate-backend:
    name: "[1] Backend — Types, Format"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run typecheck --workspace=src/backend

      - name: Prettier format check
        run: npm run format:check --workspace=src/backend

  # ── Analytics: Ruff lint + Ruff format + Syntax ──────────────────────────
  validate-analytics:
    name: "[1] Analytics — Lint, Format, Syntax"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: src/analytics/requirements.txt

      - name: Install dependencies
        run: pip install -r src/analytics/requirements.txt ruff

      - name: Ruff lint
        run: ruff check src/analytics/

      - name: Ruff format check
        run: ruff format --check src/analytics/

      - name: Syntax validation
        run: |
          find src/analytics -name "*.py" | xargs python -m py_compile
          echo "All Python files are syntactically valid."

  # ── Security: No secrets, no committed .env ───────────────────────────────
  validate-security:
    name: "[1] Security — Secrets Scan"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reject committed .env
        run: |
          if git ls-files | grep -qE '^\.env$'; then
            echo "::error::.env is committed. Run: git rm --cached .env"
            exit 1
          fi
          echo ".env is not tracked — OK"

      - name: Scan for raw JWT tokens
        run: |
          PATTERN='eyJ[a-zA-Z0-9_-]{20,}\.[a-zA-Z0-9_-]{20,}\.[a-zA-Z0-9_-]{20,}'
          MATCHES=$(grep -rE "$PATTERN" \
            --include="*.ts" --include="*.tsx" --include="*.py" \
            --include="*.js" --include="*.json" --include="*.sql" \
            --exclude-dir=node_modules --exclude-dir=dist \
            --exclude-dir=.next --exclude-dir=.git \
            . 2>/dev/null || true)
          if [ -n "$MATCHES" ]; then
            echo "::error::Raw JWT / API key found in source files:"
            echo "$MATCHES"
            exit 1
          fi
          echo "No raw secrets detected — OK"

# =============================================================================
# STAGE 2 — BUILD & AUDIT
# Compiles all services and scans for known CVEs in dependencies.
# Only runs when every Stage 1 job passes.
# =============================================================================

  build-frontend:
    name: "[2] Frontend — Build"
    runs-on: ubuntu-latest
    needs: [validate-frontend, validate-backend, validate-analytics, validate-security]
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
      NEXT_PUBLIC_GOOGLE_MAPS_PLATFORM_KEY: placeholder-maps-key
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build:frontend

  build-backend:
    name: "[2] Backend — Build"
    runs-on: ubuntu-latest
    needs: [validate-frontend, validate-backend, validate-analytics, validate-security]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build backend
        run: npm run build:backend

  audit-dependencies:
    name: "[2] Dependency CVE Audit"
    runs-on: ubuntu-latest
    needs: [validate-frontend, validate-backend, validate-analytics, validate-security]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: src/analytics/requirements.txt

      - name: Install Node dependencies
        run: npm ci

      - name: npm audit (high + critical only)
        run: npm audit --audit-level=high

      - name: Install pip-audit
        run: pip install pip-audit

      - name: pip-audit (Python CVEs)
        run: pip-audit -r src/analytics/requirements.txt

# =============================================================================
# STAGE 3 — QUALITY GATE
# SonarCloud deep analysis: duplication, code smells, security hotspots.
# Only runs when all builds and audits pass.
# Requires SONAR_TOKEN secret configured in GitHub repository settings.
# =============================================================================

  sonarcloud:
    name: "[3] SonarCloud Quality Gate"
    runs-on: ubuntu-latest
    needs: [build-frontend, build-backend, audit-dependencies]
    if: github.actor != 'dependabot[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
