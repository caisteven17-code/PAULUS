name: Validate

on:
  pull_request:
    branches:
      - main
      - develop
      - "release/**"
  push:
    branches:
      - main
      - develop
      - "feature/**"
      - "release/**"

permissions:
  contents: read

jobs:
  structure:
    name: Repository structure
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate expected project layout
        shell: bash
        run: |
          set -euo pipefail

          required_paths=(
            "package.json"
            "src/frontend/package.json"
            "src/backend/package.json"
            "src/analytics/pyproject.toml"
            "src/analytics/requirements.txt"
          )

          for path in "${required_paths[@]}"; do
            test -e "$path" || {
              echo "Missing required path: $path"
              exit 1
            }
          done

          if [ ! -e "src/mobile/package.json" ]; then
            echo "src/mobile is not present yet; mobile validation will run automatically once it is added."
          fi

  node-workspaces:
    name: Frontend and backend
    runs-on: ubuntu-latest
    needs: structure
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Lint backend
        run: npm run lint --workspace=src/backend

      - name: Lint frontend (non-blocking)
        continue-on-error: true
        run: npm run lint --workspace=src/frontend

      - name: Test
        run: npm test

      - name: Build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          SUPABASE_URL: https://placeholder.supabase.co
          SUPABASE_ANON_KEY: placeholder-anon-key
          SUPABASE_SERVICE_ROLE_KEY: placeholder-service-role-key
          GEMINI_API_KEY: placeholder-gemini-key
          GOOGLE_MAPS_PLATFORM_KEY: placeholder-google-maps-key
          NEXT_PUBLIC_GOOGLE_MAPS_PLATFORM_KEY: placeholder-google-maps-key
        run: npm run build

  analytics:
    name: Python analytics
    runs-on: ubuntu-latest
    needs: structure
    defaults:
      run:
        working-directory: src/analytics
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: src/analytics/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pytest

      - name: Lint
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

      - name: Test
        shell: bash
        run: |
          if find . -type f \( -name "test_*.py" -o -name "*_test.py" \) | grep -q .; then
            pytest
          else
            echo "No Python tests found yet; skipping pytest."
          fi

  mobile:
    name: Mobile app
    runs-on: ubuntu-latest
    needs: structure
    defaults:
      run:
        working-directory: .
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect mobile app
        id: mobile
        shell: bash
        run: |
          if [ -f "src/mobile/package.json" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "src/mobile is not present yet; skipping mobile validation."
          fi

      - name: Setup Node.js
        if: ${{ steps.mobile.outputs.present == 'true' }}
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/mobile/package-lock.json

      - name: Install dependencies
        if: ${{ steps.mobile.outputs.present == 'true' }}
        working-directory: src/mobile
        run: npm ci

      - name: Lint
        if: ${{ steps.mobile.outputs.present == 'true' }}
        working-directory: src/mobile
        run: npm run lint --if-present

      - name: Typecheck
        if: ${{ steps.mobile.outputs.present == 'true' }}
        working-directory: src/mobile
        run: npm run typecheck --if-present

      - name: Test
        if: ${{ steps.mobile.outputs.present == 'true' }}
        working-directory: src/mobile
        run: npm test --if-present

      - name: Expo validation
        if: ${{ steps.mobile.outputs.present == 'true' }}
        working-directory: src/mobile
        run: npx expo-doctor

  sonar:
    name: Sonar scan
    runs-on: ubuntu-latest
    needs:
      - node-workspaces
      - analytics
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run SonarQube scan
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Skip SonarQube scan
        if: ${{ env.SONAR_TOKEN == '' }}
        run: echo "SONAR_TOKEN is not configured; skipping SonarQube scan."
