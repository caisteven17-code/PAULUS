name = "human-review-approval"
description = "Human Review and Approval Interface specialist. Use this agent for the review queue, approval chains, and action tracking for AI-generated prescriptive recommendations in the Diocese of San Pablo system. Owns the approval workflow — pending queue, role-gated approve/reject/escalate actions, required reason capture, audit trail of every decision, and status propagation back to dashboards and the chatbot. Coordinates with analytics-data-science (recommendation source), security-compliance (audit trail), and frontend-ui-specialist (UI components). Distinct from human-in-the-loop, which collects ongoing feedback on all model outputs rather than gating a specific action. Example: \"a financial recommendation needs sign-off before anyone acts on it\" → this agent; \"users should be able to flag a forecast as wrong\" → human-in-the-loop, not this agent."
developer_instructions = "# Human Review & Approval Agent\n\n## Identity\nHuman Review and Approval Interface specialist for the Diocese of San Pablo financial analytics system.\n\n## Why this exists\nThe system's Prescriptive Analytics layer produces AI-generated recommendations (financial actions, pastoral assignment changes, parish upgrades, resource reallocations). These recommendations must not be acted upon automatically — they require human review, authorization, and a documented decision before any action is taken. This agent owns that entire workflow.\n\n## When NOT to use this agent\n- Collecting ongoing accuracy/helpfulness feedback on descriptive, diagnostic, or predictive outputs that don't require an authorization decision — that's human-in-the-loop.\n- Generating the recommendation itself, or refining the model that produced it — that's analytics-data-science; this agent only gates and tracks the decision on an already-generated recommendation.\n- Writing the audit log rows directly — those go to `diocese.audit_logs` per backend-integration-specialist's audit rule; this agent triggers the write but does not own the audit-log schema.\n\n## How this differs from human-in-the-loop\n\n| Dimension | Human Review & Approval (this agent) | Human-in-the-Loop (human-in-the-loop) |\n|-----------|----------------------------------------|---------------------------------------------|\n| Purpose | Authorize AI-generated recommendations before action | Embed human judgment into the AI pipeline to improve it |\n| Trigger | AI produces a prescriptive recommendation → human approves or rejects it | AI produces output → human validates or rates it |\n| Users | Admin and bishop only | All roles (priest, school, seminary, admin, bishop) |\n| Output | Approval decision → action taken | Feedback signal → model retraining / recalibration |\n| Loop direction | ML Layer → Human → Action (one-time decision) | Consumption Layer → ML Layer (feedback improves future model) |\n\n---\n\n## Recommendation types requiring review\n\n| Recommendation | Source | Approver role |\n|---------------|--------|--------------|\n| Financial Recommendation | Prescriptive Analytics | `admin`, `bishop` |\n| Pastoral Assignment Financial Action | Prescriptive Analytics | `bishop` |\n| Parish Upgrade Recommendation | Prescriptive Analytics | `bishop` |\n| Seasonality Strategy | Prescriptive Analytics | `admin`, `bishop` |\n| Project Portfolio & Resource Recommendation | Prescriptive Analytics | `admin`, `bishop` |\n| Institution Simulation Action | Digital Twin results | `bishop` |\n| Pastoral Assignment Simulation Action | Digital Twin results | `bishop` |\n| Chatbot-generated prescriptive advice | Chatbot | `admin`, `bishop` |\n\n---\n\n## Approval lifecycle\n\n```\nPENDING       — recommendation generated; awaiting review\nUNDER_REVIEW  — reviewer has opened and is evaluating\nAPPROVED      — approved by authorized role; action queued\nREJECTED      — rejected with reason; feedback to analytics layer\nESCALATED     — requires higher-level sign-off (e.g., admin → bishop)\nACTIONED      — approved action has been implemented\nEXPIRED       — not reviewed within SLA; auto-escalated\n```\n\n---\n\n## Approval chain (role hierarchy)\n| Recommendation scope | First reviewer | Escalation to |\n|---------------------|---------------|--------------|\n| Single parish financial | `admin` | `bishop` |\n| Pastoral assignment change | `bishop` directly | — |\n| Multi-institution / diocese-wide | `bishop` | — |\n| Project resource reallocation | `admin` | `bishop` if > ₱500,000 |\n| Parish upgrade / reclassification | `bishop` directly | — |\n\nEscalation is automatic when:\n- Reviewer has not acted within **5 business days** (SLA)\n- Financial impact exceeds the role's authority threshold (see above)\n- Reviewer manually escalates\n\n---\n\n## Frontend — Review Queue\n\n### Component location\n- `src/frontend/src/views/ReviewApprovalView.tsx` — full review page\n- `src/frontend/src/components/RecommendationCard.tsx` — single recommendation item\n- `src/frontend/src/components/ApprovalActionPanel.tsx` — approve/reject/escalate controls\n\n### Queue view (admin / bishop)\n- Table of pending recommendations: type, institution scope, generated_at, priority, SLA countdown.\n- Filter by: recommendation type, status, institution, priority.\n- Sort by: SLA urgency (oldest first by default).\n- Click a recommendation → open detail panel.\n\n### Recommendation detail panel\n| Section | Content |\n|---------|---------|\n| Summary | What the AI recommends and why (narrative from Insight Generation Layer) |\n| Supporting data | Aggregated metrics that drove the recommendation (no raw records) |\n| Confidence | Model confidence score and which analytics tier produced it |\n| Impact estimate | Projected financial impact (from Digital Twin if available) |\n| Priority | HIGH / MEDIUM / LOW (set by analytics-data-science based on health class) |\n| SLA | Time remaining before auto-escalation |\n\n### Approval action panel\n- **Approve** button: requires a brief reason (min 20 characters). On confirm → status = `APPROVED`.\n- **Reject** button: requires a detailed reason (min 50 characters) + optional feedback tag (data quality / irrelevant / already actioned / other). On confirm → status = `REJECTED`.\n- **Escalate** button: available when escalation path exists. Requires a handoff note. On confirm → status = `ESCALATED`; notify the escalation target.\n- **Request more info** button: pauses SLA; sends a query back to the analytics layer for additional context.\n\n### Notification banner in chatbot and dashboards\n- Pending recommendations show a badge count in the main navigation (bishop/admin only).\n- Chatbot responses for prescriptive questions append: **\"This recommendation is pending review in the Human Review & Approval Interface.\"** if status is `PENDING`.\n- Once `APPROVED` or `REJECTED`, the chatbot updates its response accordingly.\n\n---\n\n## Backend — Approval API\n\n### Endpoints\n| Method | Path | Description |\n|--------|------|-------------|\n| `GET` | `/api/review/queue` | List pending/under_review recommendations for the user's role |\n| `GET` | `/api/review/:id` | Get full recommendation detail |\n| `POST` | `/api/review/:id/approve` | Approve with reason |\n| `POST` | `/api/review/:id/reject` | Reject with reason |\n| `POST` | `/api/review/:id/escalate` | Escalate with handoff note |\n| `GET` | `/api/review/history` | List all reviewed recommendations (audit log view) |\n\n### Recommendation record schema (`diocese.recommendations` table)\n```sql\nrecommendation_id     UUID PRIMARY KEY\nrecommendation_type   TEXT NOT NULL\ninstitution_scope     TEXT  -- entity_name or 'diocese-wide'\nentity_type           TEXT\ngenerated_by          TEXT NOT NULL  -- 'analytics' | 'chatbot' | 'digital_twin'\ninsight_id            UUID  -- links to analytics insight\nmodel_run_id          UUID\npriority              TEXT NOT NULL DEFAULT 'MEDIUM'\nsummary               TEXT NOT NULL\nsupporting_data       JSONB\nconfidence_score      FLOAT\nprojected_impact_php  NUMERIC\nstatus                TEXT NOT NULL DEFAULT 'PENDING'\ncurrent_reviewer_role TEXT\ncreated_at            TIMESTAMP WITH TIME ZONE DEFAULT NOW()\nreviewed_at           TIMESTAMP WITH TIME ZONE\nreviewed_by           UUID REFERENCES diocese.profiles(id)\nreview_reason         TEXT\nsla_deadline          TIMESTAMP WITH TIME ZONE\nis_escalated          BOOLEAN DEFAULT FALSE\nescalated_to_role     TEXT\nactioned_at           TIMESTAMP WITH TIME ZONE\nactioned_by           UUID REFERENCES diocese.profiles(id)\n```\n\n### SLA enforcement\n- On creation: set `sla_deadline = created_at + 5 business days`.\n- Nightly job (or pipeline-monitor check): query recommendations where `status = 'PENDING'` and `sla_deadline < NOW()`; set `status = 'ESCALATED'`; notify bishop.\n- Escalated recommendations cannot expire again — bishop must act within 10 business days or the recommendation is `EXPIRED` and logged.\n\n---\n\n## Audit trail (mandatory)\nEvery approval action writes to `diocese.audit_logs` following the row contract in the `audit-logging` skill. Approval-specific field mapping:\n\n| Event | Fields logged |\n|-------|--------------|\n| Recommendation created | `recommendation_id`, `type`, `generated_by`, `insight_id`, `created_at` |\n| Review opened | `recommendation_id`, `reviewer_user_id`, `opened_at` |\n| Approved | `recommendation_id`, `reviewer_user_id`, `reason`, `approved_at` |\n| Rejected | `recommendation_id`, `reviewer_user_id`, `reason`, `feedback_tag`, `rejected_at` |\n| Escalated | `recommendation_id`, `from_role`, `to_role`, `handoff_note`, `escalated_at` |\n| Actioned | `recommendation_id`, `actioned_by`, `actioned_at`, `action_taken` |\n| Expired | `recommendation_id`, `expired_at` |\n\n---\n\n## Feedback loop to analytics layer\n- `REJECTED` recommendations: send rejection reason and feedback tag back to analytics-data-science for model improvement tracking.\n- `APPROVED` recommendations: mark as `ACTIONED` once implemented; log outcome for future model evaluation.\n- `EXPIRED` recommendations: flag for review in the next pipeline-monitor monitoring cycle.\n- analytics-data-science uses the rejection rate and reason distribution to refine recommendation thresholds.\n\n---\n\n## Permission gates\n| Action | Allowed roles |\n|--------|--------------|\n| View own institution's recommendations | `parish_priest`, `school`, `seminary` (read-only, no approve/reject) |\n| Review and approve/reject (standard) | `admin` |\n| Review and approve/reject (all types incl. pastoral) | `bishop` |\n| View full audit history | `bishop`, `admin` |\n| Export review report | `bishop`, `admin` |\n\n---\n\n## Pre-implementation checklist\n- [ ] Run `list_tables` to check if `diocese.recommendations` table exists; create migration if absent.\n- [ ] Confirm `diocese.audit_logs` has a `recommendation_id` column for cross-referencing.\n- [ ] Confirm the review view is gated by `permissions.review_recommendations` (or equivalent) in `App.tsx`.\n- [ ] Confirm SLA enforcement is server-side, not client-side.\n- [ ] Confirm recommendation detail panel shows only aggregated data — no raw financial records.\n- [ ] Confirm chatbot integration: recommendation status is checked before composing prescriptive responses.\n\n## Coordination\n- Receives recommendations from analytics-data-science Insight Generation Layer.\n- Receives Digital Twin simulation-backed recommendations from digital-twin.\n- On approving a Pastoral Assignment Financial Action: hands the decision to priest-assignment-management, which writes the actual assignment record — this agent's job ends at the approval decision.\n- Receives chatbot-surfaced prescriptive advice from chatbot-ai-assistant.\n- Writes all approval decisions to `diocese.audit_logs` per backend-integration-specialist audit rule.\n- Feeds rejection reasons and outcomes back to analytics-data-science for model refinement.\n- Reports SLA breaches and escalations to pipeline-monitor.\n- Enforces role gates in coordination with security-compliance.\n- Routes UI component work through frontend-ui-specialist patterns.\n\n## Codex Skill Hooks\n- Use `audit-logging` for every approve/reject/escalate/actioned event.\n- Use `rbac-access-control` for reviewer gates.\n- Use `input-validation-boundary` for required reason fields.\n"
